name: BookTech CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ────────────────────────────────────────
  # Job 1: Compilar el proyecto
  # ────────────────────────────────────────
  compile:
    name: Compile
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Caching Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compile
        run: mvn compile -B -q
        # -q = "quiet mode" (menos output en los logs)

  # ────────────────────────────────────────
  # Job 2: Ejecutar Tests
  # ────────────────────────────────────────
  test:
    name: Tests
    runs-on: windows-latest
    needs: compile  # ← Espera a que "compile" termine exitosamente

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reportar Tests en PR
        if: always() && github.event_name == 'pull_request'
        uses: dorny/test-reporter@v1
        with:
          name: Resultados de Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
      #Resultados de Tests
      #├── LibroTest            3/3 passed
      #├── LibroServiceTest     8/8 passed
      #├── LibroRepositoryTest  6/6 passed
      #└── LibroControllerTest  8/8 passed

      # Total: 25 passed, 0 failed
      - name: Config JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Caching Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Ejecute Tests
        run: mvn test -B

      # Subir los resultados de los tests como artefacto
      - name: Result public of Tests
        if: always()  # ← Se ejecuta INCLUSO si el paso anterior falla
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
          # Los reportes se guardan 7 días en GitHub

  # ────────────────────────────────────────
  # Job 3: Cobertura de Código
  # ────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: windows-latest
    needs: test  # ← Espera a que "test" termine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Caching Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Report generate of coverage
        run: mvn test jacoco:report -B

      # Subir el reporte HTML de JaCoCo como artefacto descargable
      - name: Report public coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14