spring.application.name=BookTech
# Conexión a Base de Datos H2 (Cambia 'file' por 'mem' si no la quieres en disco)
spring.datasource.url=jdbc:h2:file:./data/librotech_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.generate-unique-name=false
# Configuración Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ===== FLYWAY: Maneja la creación de tablas =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# ===== HIBERNATE: Solo valida que la estructura coincida con las entidades =====
spring.jpa.hibernate.ddl-auto=validate
# DEBUG de Flyway para validar si las migraciones se ejecutan
logging.level.org.flywaydb=DEBUG
# ===== DEVTOOLS: disable automatic restart while running from Maven =====
spring.devtools.restart.enabled=false
# ===== AUDITORÍA SQL EN CONSOLA =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Consola H2 para visualización
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
